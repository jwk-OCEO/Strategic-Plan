<style>
  :root {
    --color-bg: #f3f2f2;
    --color-surface: #eae9e9;
    --color-text: #201e1d;
    --color-accent: #ec3013;
    --color-accent-600: #dd2b0f;
    --color-accent-700: #ae1800;
    --color-divider: rgba(32,30,29,0.4);
    --color-neutral-300: #d7d3d3;
    --color-neutral-500: #9b9797;
    --color-neutral-600: #7d7979;
    --color-neutral-700: #605d5d;
    --font-heading: "Archivo", system-ui, sans-serif;
    --font-body: "Archivo", system-ui, sans-serif;
  }
  * , *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
  h1, h2 { font-family: var(--font-heading); font-weight: 700; margin: 0; }
  textarea.sm-in {
    width: 100%; border: 0; background: transparent; resize: none; outline: none;
    font: inherit; color: var(--color-text); padding: 0;
  }
  textarea.sm-in::placeholder { color: var(--color-neutral-500); }
  button { font-family: var(--font-body); }
  .sm-toolbtn {
    font: inherit; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;
    cursor: pointer; padding: 6px 12px; border: 2px solid var(--color-text); background: transparent; color: var(--color-text);
  }
  .sm-toolbtn:hover { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
  .sm-toolbtn.sm-muted { border-color: var(--color-neutral-300); color: var(--color-neutral-600); }
  .sm-toolbtn.sm-primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
  .sm-toolbtn.sm-primary:hover { background: var(--color-accent-600); border-color: var(--color-accent-600); }
  .sm-toolbtn:disabled { opacity: 0.5; cursor: default; }
  .sm-linkbtn {
    cursor: pointer; background: transparent; border: 0; padding: 0; font: inherit;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--color-neutral-500);
  }
  .sm-linkbtn:hover { color: var(--color-accent); }
  .sm-linkbtn.sm-accentlink { color: var(--color-accent-700); }
  .sm-linkbtn.sm-accentlink:hover { color: var(--color-accent); }
  @media print {
    .sm-noprint { display: none !important; }
    body { background: #fff; }
    .sm-page { width: auto !important; padding: 0 !important; }
  }
  ::selection { background: rgba(236,48,19,0.3); }
  a { color: var(--color-accent); }
</style>

function getMapIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get("map");
}

function setMapIdInUrl(id) {
  const url = new URL(window.location.href);
  if (id) url.searchParams.set("map", id);
  else url.searchParams.delete("map");
  window.history.pushState({}, "", url);
}

// ---- Home screen: list + create maps --------------------------------------
function HomeScreen({ onOpen }) {
  const [maps, setMaps] = useState(null);
  const [error, setError] = useState(null);
  const [creating, setCreating] = useState(false);
  const [newName, setNewName] = useState("");

  const load = useCallback(async () => {
    const { data, error } = await supabase
      .from("strategy_maps")
      .select("id, name, prev_year, curr_year, updated_at")
      .order("updated_at", { ascending: false });
    if (error) setError(error.message);
    else setMaps(data);
  }, []);

  useEffect(() => { load(); }, [load]);

  const createMap = async () => {
    const name = newName.trim() || "Untitled Strategy Map";
    setCreating(true);
    const { data, error } = await supabase
      .from("strategy_maps")
      .insert({ name, years: defaultYears() })
      .select()
      .single();
    setCreating(false);
    if (error) { setError(error.message); return; }
    onOpen(data.id);
  };

  return (
    <div style={{ maxWidth: 760, margin: "0 auto", padding: "72px 24px" }}>
      <div style={{ fontSize: 12, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 700, color: "var(--color-accent-700)" }}>
        CORPORATE — OFFICE OF THE CEO
      </div>
      <h1 style={{ fontSize: 40, lineHeight: 1.05, letterSpacing: "-0.02em", margin: "12px 0 8px" }}>Strategy Maps</h1>
      <p style={{ color: "var(--color-neutral-700)", margin: "0 0 32px" }}>
        Open an existing map, or start a new one for a different project or business unit.
      </p>

      <div style={{ display: "flex", gap: 10, marginBottom: 40 }}>
        <input
          value={newName}
          onChange={(e) => setNewName(e.target.value)}
          placeholder="New map name (e.g. Carbon Market Block 2)"
          style={{
            flex: 1, font: "inherit", fontSize: 14, padding: "10px 12px",
            border: "2px solid var(--color-text)", background: "#fff", color: "var(--color-text)",
          }}
          onKeyDown={(e) => { if (e.key === "Enter") createMap(); }}
        />
        <button className="sm-toolbtn sm-primary" disabled={creating} onClick={createMap}>
          {creating ? "Creating…" : "+ New Map"}
        </button>
      </div>

      {error && (
        <div style={{ color: "var(--color-accent-700)", marginBottom: 20, fontSize: 13 }}>
          Couldn't load maps: {error}. Check that SUPABASE_URL / SUPABASE_ANON_KEY are set correctly at the top of this file, and that the schema has been run.
        </div>
      )}

      {maps === null && !error && <div style={{ color: "var(--color-neutral-600)" }}>Loading…</div>}

      {maps && maps.length === 0 && (
        <div style={{ color: "var(--color-neutral-600)" }}>No maps yet — create your first one above.</div>
      )}

      {maps && maps.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column" }}>
          {maps.map((m) => (
            <button
              key={m.id}
              onClick={() => onOpen(m.id)}
              style={{
                display: "flex", justifyContent: "space-between", alignItems: "center",
                width: "100%", textAlign: "left", background: "#fff", border: "2px solid var(--color-text)",
                borderTop: "2px solid var(--color-text)", marginTop: -2, padding: "16px 18px", cursor: "pointer",
                font: "inherit",
              }}
            >
              <span style={{ fontFamily: "var(--font-heading)", fontWeight: 700, fontSize: 16 }}>{m.name}</span>
              <span style={{ fontSize: 12, color: "var(--color-neutral-600)" }}>
                {m.prev_year}–{m.curr_year} · updated {new Date(m.updated_at).toLocaleDateString()}
              </span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// ---- Editor screen ----------------------------------------------------------
function EditorScreen({ mapId, onHome }) {
  const [row, setRow] = useState(null);
  const [years, setYears] = useState(null);
  const [error, setError] = useState(null);
  const [editing, setEditing] = useState(true);
  const [showPrev, setShowPrev] = useState(true);
  const [saveState, setSaveState] = useState("idle"); // idle | saving | saved | dirty
  const [exportingImage, setExportingImage] = useState(false);
  const [copyLabel, setCopyLabel] = useState("Copy Link");
  const [nameDraft, setNameDraft] = useState("");
  const saveTimer = useRef(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const { data, error } = await supabase.from("strategy_maps").select("*").eq("id", mapId).single();
      if (cancelled) return;
      if (error) { setError(error.message); return; }
      setRow(data);
      setYears(data.years);
      setNameDraft(data.name);
    })();
    return () => { cancelled = true; };
  }, [mapId]);

  const persist = useCallback(async (patch) => {
    setSaveState("saving");
    const { error } = await supabase.from("strategy_maps").update(patch).eq("id", mapId);
    if (error) { setError(error.message); setSaveState("dirty"); return; }
    setSaveState("saved");
    clearTimeout(persist._t);
    persist._t = setTimeout(() => setSaveState((s) => (s === "saved" ? "idle" : s)), 1800);
  }, [mapId]);

  const scheduleSave = useCallback((nextYears) => {
    setSaveState("dirty");
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => persist({ years: nextYears }), 900);
  }, [persist]);

  const mutate = useCallback((fn) => {
    setYears((s) => {
      const next = clone(s);
      fn(next);
      scheduleSave(next);
      return next;
    });
  }, [scheduleSave]);

  const saveNow = () => {
    clearTimeout(saveTimer.current);
    persist({ years });
  };

  const renameNow = () => {
    const name = nameDraft.trim() || "Untitled Strategy Map";
    setNameDraft(name);
    persist({ name });
  };

  const resetMap = () => {
    if (!window.confirm("Reset this map to the starting template? Current entries will be lost.")) return;
    const next = defaultYears();
    setYears(next);
    persist({ years: next });
  };

  const copyLink = async () => {
    const url = new URL(window.location.href);
    url.searchParams.set("map", mapId);
    try {
      await navigator.clipboard.writeText(url.toString());
      setCopyLabel("Copied ✓");
    } catch (e) {
      setCopyLabel("Copy failed");
    }
    clearTimeout(copyLink._t);
    copyLink._t = setTimeout(() => setCopyLabel("Copy Link"), 1800);
  };

  const exportImage = () => {
    if (exportingImage) return;
    setEditing(false);
    setExportingImage(true);
    setTimeout(() => {
      const el = document.querySelector(".sm-page");
      if (!window.html2canvas || !el) {
        window.alert("Image export is still loading — please try again in a moment.");
        setExportingImage(false);
        return;
      }
      window.html2canvas(el, {
        scale: 3,
        backgroundColor: "#ffffff",
        useCORS: true,
        onclone: (doc) => { doc.querySelectorAll(".sm-noprint").forEach((n) => { n.style.display = "none"; }); },
      }).then((canvas) => {
        const link = document.createElement("a");
        link.download = (row?.name || "strategy-map").replace(/[^\w.-]+/g, "_") + ".png";
        link.href = canvas.toDataURL("image/png");
        link.click();
        setExportingImage(false);
      }).catch((err) => {
        console.error(err);
        window.alert("Image export failed. Please try again.");
        setExportingImage(false);
      });
    }, 80);
  };

  const exportPdf = () => {
    setEditing(false);
    setTimeout(() => window.print(), 60);
  };

  if (error) {
    return (
      <div style={{ maxWidth: 600, margin: "80px auto", textAlign: "center" }}>
        <p style={{ color: "var(--color-accent-700)" }}>Couldn't load this map: {error}</p>
        <button className="sm-toolbtn" onClick={onHome}>← All Maps</button>
      </div>
    );
  }

  if (!row || !years) {
    return <div style={{ textAlign: "center", padding: 80, color: "var(--color-neutral-600)" }}>Loading…</div>;
  }

  const prevYear = row.prev_year || "2026";
  const currYear = row.curr_year || "2027";
  const laneKeys = showPrev ? ["prev", "curr"] : ["curr"];
  const locked = !editing;

  const saveLabel = { idle: "Save", saving: "Saving…", saved: "Saved ✓", dirty: "Save" }[saveState];

  return (
    <div className="sm-page" style={{ width: 1440, maxWidth: "100%", margin: "0 auto", padding: "40px 64px 72px", background: "var(--color-bg)" }}>
      <div className="sm-noprint" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingBottom: 16 }}>
        <button className="sm-linkbtn" onClick={onHome}>← All Maps</button>
        <span style={{ fontSize: 11, color: "var(--color-neutral-600)", letterSpacing: "0.08em", textTransform: "uppercase" }}>
          {saveState === "dirty" ? "Unsaved changes" : saveState === "saving" ? "Saving…" : "All changes saved"}
        </span>
      </div>

      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 48, paddingBottom: 20 }}>
        <div style={{ maxWidth: 760, flex: 1 }}>
          <div style={{ fontSize: 12, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 700, color: "var(--color-accent-700)" }}>
            CORPORATE — OFFICE OF THE CEO
          </div>
          {editing ? (
            <input
              value={nameDraft}
              onChange={(e) => setNameDraft(e.target.value)}
              onBlur={renameNow}
              onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
              style={{
                display: "block", width: "100%", fontFamily: "var(--font-heading)", fontSize: 52, lineHeight: 1.02,
                fontWeight: 700, margin: "12px 0 0", letterSpacing: "-0.02em", border: 0, borderBottom: "2px dashed var(--color-neutral-300)",
                background: "transparent", padding: "0 0 4px", color: "var(--color-text)",
              }}
            />
          ) : (
            <h1 style={{ fontSize: 52, lineHeight: 1.02, margin: "12px 0 0", letterSpacing: "-0.02em" }}>{row.name}</h1>
          )}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "auto auto", gap: "6px 28px", fontSize: 13, paddingBottom: 6 }}>
          <span style={{ color: "var(--color-neutral-600)", textTransform: "uppercase", letterSpacing: "0.1em", fontSize: 11, fontWeight: 700 }}>Horizon</span>
          <span style={{ fontWeight: 600 }}>FY{currYear}</span>
          <span style={{ color: "var(--color-neutral-600)", textTransform: "uppercase", letterSpacing: "0.1em", fontSize: 11, fontWeight: 700 }}>Owner</span>
          <span style={{ fontWeight: 600 }}>Office of the CEO</span>
        </div>
      </div>

      <div style={{ height: 2, background: "var(--color-divider)" }} />

      <div style={{ display: "grid", gridTemplateColumns: "46px 1fr", gap: 20, padding: "14px 0 10px", alignItems: "center" }}>
        <div></div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 20, flexWrap: "wrap" }}>
          <span style={{ fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", fontWeight: 700, color: "var(--color-neutral-600)" }}>Objectives</span>
          <div className="sm-noprint" style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <button className="sm-toolbtn sm-muted" onClick={() => setShowPrev((s) => !s)}>{showPrev ? "Hide " + prevYear : "Show " + prevYear}</button>
            <button className="sm-toolbtn" onClick={() => setEditing((e) => !e)}>{editing ? "Editing — click to lock" : "Locked — click to edit"}</button>
            <button className="sm-toolbtn" onClick={saveNow}>{saveLabel}</button>
            <button className="sm-toolbtn sm-muted" onClick={resetMap}>Reset</button>
            <button className="sm-toolbtn sm-muted" onClick={copyLink}>{copyLabel}</button>
            <button className="sm-toolbtn sm-primary" onClick={exportPdf}>Export PDF</button>
            <button className="sm-toolbtn sm-primary" onClick={exportImage}>{exportingImage ? "Rendering…" : "Save Image"}</button>
          </div>
        </div>
      </div>

      {BAND_DEFS.map((band, bi) => (
        <div key={band.abbr} style={{ borderTop: "2px solid var(--color-divider)" }}>
          <div style={{ display: "grid", gridTemplateColumns: "auto 1fr", gap: 20, padding: "26px 0 30px", alignItems: "stretch" }}>
            <div style={{ display: "flex" }}>
              <h2 style={{
                alignSelf: "stretch", background: "var(--color-accent)", color: "#fff", fontSize: 16, lineHeight: 1.15,
                fontWeight: 700, letterSpacing: "0.08em", padding: "14px 10px", textTransform: "uppercase",
                writingMode: "vertical-rl", transform: "rotate(180deg)", whiteSpace: "nowrap",
              }}>{band.name}</h2>
            </div>
            <div style={{ display: "flex", gap: 28, alignItems: "stretch" }}>
              {laneKeys.map((key) => {
                const isPrev = key === "prev" && showPrev;
                const label = key === "prev" ? prevYear + " — previous" : currYear + " — current";
                const cells = years[key][bi] || [];
                const canCopyAll = key === "prev" && editing && (years.prev[bi] || []).length > 0;
                return (
                  <div key={key} style={{ flex: "1 1 0", minWidth: 0, display: "flex", gap: 28 }}>
                    <div style={{ flex: "1 1 0", minWidth: 0 }}>
                      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 12, paddingBottom: 12 }}>
                        <span style={{ fontFamily: "var(--font-heading)", fontSize: 13, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--color-neutral-600)" }}>{label}</span>
                        {canCopyAll && (
                          <button className="sm-linkbtn sm-accentlink sm-noprint" onClick={() => mutate((y) => { (y.prev[bi] || []).forEach((c) => y.curr[bi].push(clone(c))); })}>
                            Copy all to {currYear} →
                          </button>
                        )}
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(210px, 1fr))", gap: 20, alignItems: "stretch" }}>
                        {cells.map((cell, ci) => (
                          <div key={ci} className="sm-card" style={{ border: "2px solid var(--color-text)", background: "#fff", padding: 16, minHeight: 104, display: "flex", flexDirection: "column", gap: 10 }}>
                            <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
                              <textarea
                                className="sm-in" rows={2} value={cell.title} readOnly={locked}
                                placeholder="Objective"
                                style={{ fontFamily: "var(--font-heading)", fontSize: 17, lineHeight: 1.18, fontWeight: 700, letterSpacing: "-0.01em" }}
                                onChange={(e) => { const v = e.target.value; mutate((y) => { y[key][bi][ci].title = v; }); }}
                              />
                              {editing && (
                                <button className="sm-linkbtn" title="Delete objective" style={{ fontSize: 15 }} onClick={() => mutate((y) => { y[key][bi].splice(ci, 1); })}>×</button>
                              )}
                            </div>
                            {cell.items.length > 0 && (
                              <div style={{ paddingTop: 10, borderTop: "2px solid var(--color-divider)", display: "flex", flexDirection: "column", gap: 5, fontSize: 13, lineHeight: 1.35, color: "var(--color-neutral-700)" }}>
                                <div style={{ fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase", fontWeight: 700, color: "var(--color-neutral-500)" }}>Initiatives</div>
                                {cell.items.map((item, ii) => (
                                  <div key={ii} style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
                                    <textarea
                                      className="sm-in" rows={1} value={item.text} readOnly={locked}
                                      placeholder="Initiative" style={{ flex: "1 1 auto", lineHeight: 1.35, fontWeight: 700 }}
                                      onChange={(e) => { const v = e.target.value; mutate((y) => { y[key][bi][ci].items[ii].text = v; }); }}
                                    />
                                    {editing && (
                                      <button className="sm-linkbtn" title="Delete initiative" style={{ fontSize: 13 }} onClick={() => mutate((y) => { y[key][bi][ci].items.splice(ii, 1); })}>×</button>
                                    )}
                                  </div>
                                ))}
                              </div>
                            )}
                            {editing && (
                              <div className="sm-noprint" style={{ marginTop: "auto", display: "flex", gap: 14, alignItems: "center", paddingTop: 6 }}>
                                <button className="sm-linkbtn" onClick={() => mutate((y) => { y[key][bi][ci].items.push({ text: "", target: "" }); })}>+ Initiative</button>
                                {key === "prev" && editing && (
                                  <button className="sm-linkbtn sm-accentlink" title="Copy this objective forward" onClick={() => mutate((y) => { y.curr[bi].push(clone(y.prev[bi][ci])); })}>
                                    Copy to {currYear} →
                                  </button>
                                )}
                              </div>
                            )}
                          </div>
                        ))}
                        {editing && (
                          <button
                            className="sm-noprint"
                            onClick={() => mutate((y) => { y[key][bi].push({ title: "", items: [] }); })}
                            style={{
                              cursor: "pointer", border: "2px dashed var(--color-neutral-300)", background: "transparent", minHeight: 104,
                              display: "flex", alignItems: "center", padding: 16, font: "inherit", fontSize: 12, letterSpacing: "0.1em",
                              textTransform: "uppercase", fontWeight: 700, color: "var(--color-neutral-500)", textAlign: "left",
                            }}
                          >+ Add objective</button>
                        )}
                      </div>
                    </div>
                    {isPrev && <div style={{ width: 2, background: "var(--color-divider)", alignSelf: "stretch" }} />}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      ))}

      <div style={{ height: 2, background: "var(--color-divider)" }} />
      <div style={{ marginTop: 24, padding: "12px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 32, background: "#fff" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ background: "#fff", padding: "8px 14px", display: "flex", alignItems: "center" }}>
            <img src={LOGO_SRC} alt="Megawide" style={{ display: "block", height: 30, width: "auto" }} />
          </div>
        </div>
      </div>
    </div>
  );
}

// ---- App shell --------------------------------------------------------------
function App() {
  const [mapId, setMapId] = useState(getMapIdFromUrl());

  useEffect(() => {
    const onPop = () => setMapId(getMapIdFromUrl());
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  const openMap = (id) => { setMapIdInUrl(id); setMapId(id); };
  const goHome = () => { setMapIdInUrl(null); setMapId(null); };

  if (!SUPABASE_URL || SUPABASE_URL === "YOUR_SUPABASE_PROJECT_URL") {
    return (
      <div style={{ maxWidth: 560, margin: "80px auto", padding: "0 24px" }}>
        <h1 style={{ fontSize: 28, marginBottom: 12 }}>Set up Supabase first</h1>
        <p style={{ color: "var(--color-neutral-700)" }}>
          Open this file and replace <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code>
          near the top with the values from your Supabase project's Settings → API page.
          See README.md for the full setup steps.
        </p>
      </div>
    );
  }

  return mapId ? <EditorScreen mapId={mapId} onHome={goHome} /> : <HomeScreen onOpen={openMap} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
